name: laboratorio-bd-agentes
services:
  mysql:
    image: mysql:8.3
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-meubanco}
      MYSQL_USER: ${MYSQL_USER:-usuario}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configure .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/mysql:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent"]
      interval: 15s
      timeout: 10s
      retries: 10
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Configure .env}
    volumes:
      - sqlserver_data:/var/opt/mssql
    ports:
      - "127.0.0.1:1433:1433"
    # SQL Server nao executa automaticamente /docker-entrypoint-initdb.d
  mongo:
    image: mongo:4.4
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Configure .env}
    volumes:
      - mongo_data:/data/db
      - ./db/mongo:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:27017:27017"
    # MongoDB 4.4 pode nao funcionar em CPUs modernas; ver README
  oracle:
    image: gvenzl/oracle-xe:21.3.0-slim
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Configure .env}
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./db/oracle:/container-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:1521:1521"
    # Servico padrao XEPDB1; criar usuarios e esquemas com scripts adequados
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-usuario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure .env}
      POSTGRES_DB: ${POSTGRES_DB:-meubanco}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  db_data:
  sqlserver_data:
  mongo_data:
  oracle_data:
  postgres_data:
